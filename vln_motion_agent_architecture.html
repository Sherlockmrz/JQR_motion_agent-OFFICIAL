<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VLN 与 Motion Agent 架构图</title>
  <style>
    :root {
      --bg: #f7f3ea;
      --panel: #fffdf8;
      --ink: #17212f;
      --muted: #667085;
      --line: #526071;
      --edge: #d8d0c2;
      --agent: #2563eb;
      --vln: #b45309;
      --robot: #047857;
      --data: #7c3aed;
      --danger: #be123c;
      --shadow: 0 18px 45px rgba(30, 41, 59, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 12% 10%, rgba(37, 99, 235, 0.12), transparent 28%),
        radial-gradient(circle at 78% 4%, rgba(180, 83, 9, 0.14), transparent 30%),
        linear-gradient(135deg, #f7f3ea 0%, #edf5f2 52%, #eef2ff 100%);
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 18px;
      min-height: 100vh;
      padding: 22px;
    }

    .workspace,
    .details {
      background: rgba(255, 253, 248, 0.86);
      border: 1px solid rgba(23, 33, 47, 0.1);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .workspace {
      position: relative;
      overflow: hidden;
      min-height: calc(100vh - 44px);
      border-radius: 18px;
      padding: 24px;
    }

    .details {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 44px);
      border-radius: 14px;
      padding: 18px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 760px;
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      border: 1px solid rgba(23, 33, 47, 0.14);
      background: #ffffff;
      color: var(--ink);
      border-radius: 8px;
      height: 36px;
      padding: 0 12px;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      border-color: rgba(37, 99, 235, 0.55);
      color: #1d4ed8;
    }

    button.active {
      background: #17212f;
      color: #fff;
      border-color: #17212f;
    }

    .canvas {
      position: relative;
      height: calc(100vh - 150px);
      min-height: 640px;
      border-radius: 14px;
      border: 1px solid rgba(23, 33, 47, 0.08);
      background:
        linear-gradient(rgba(23, 33, 47, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 33, 47, 0.045) 1px, transparent 1px),
        rgba(255, 255, 255, 0.48);
      background-size: 28px 28px;
      overflow: hidden;
      cursor: grab;
      user-select: none;
    }

    .canvas.panning {
      cursor: grabbing;
    }

    .viewport {
      position: absolute;
      left: 0;
      top: 0;
      width: 1240px;
      height: 760px;
      transform-origin: 0 0;
    }

    .connections {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .flow-label {
      position: absolute;
      z-index: 3;
      transform: translate(-50%, -50%);
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(255, 253, 248, 0.94);
      border: 1px solid rgba(23, 33, 47, 0.1);
      color: #344054;
      font-size: 10px;
      white-space: nowrap;
      pointer-events: none;
    }

    .node {
      position: absolute;
      z-index: 2;
      width: 156px;
      min-height: 94px;
      border: 1px solid rgba(23, 33, 47, 0.13);
      border-top: 4px solid var(--agent);
      border-radius: 10px;
      background: linear-gradient(180deg, #ffffff, #fbfbf7);
      box-shadow: 0 12px 26px rgba(30, 41, 59, 0.11);
      padding: 10px;
      cursor: grab;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
      text-align: left;
    }

    .node.dragging {
      cursor: grabbing;
      transform: translateY(-2px) scale(1.01);
      transition: none;
    }

    .node:hover,
    .node.selected {
      transform: translateY(-2px);
      box-shadow: 0 20px 40px rgba(30, 41, 59, 0.17);
      border-color: rgba(37, 99, 235, 0.55);
    }

    .node.vln {
      border-top-color: var(--vln);
    }

    .node.robot {
      border-top-color: var(--robot);
    }

    .node.data {
      border-top-color: var(--data);
    }

    .node.stop {
      border-top-color: var(--danger);
    }

    .node .kicker {
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .node h2 {
      margin: 0;
      font-size: 15px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .node p {
      margin: 8px 0 0;
      color: #526071;
      font-size: 11px;
      line-height: 1.42;
    }

    .node .open-hint {
      margin-top: 10px;
      color: #1d4ed8;
      font-size: 10px;
      font-weight: 650;
    }

    .details .eyebrow {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .details h2 {
      margin: 8px 0 10px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .details p {
      margin: 0 0 14px;
      color: #344054;
      line-height: 1.65;
      font-size: 14px;
    }

    .section-title {
      margin: 18px 0 8px;
      color: #111827;
      font-size: 13px;
      font-weight: 750;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 8px 0 12px;
    }

    .pill {
      padding: 5px 8px;
      border-radius: 999px;
      background: #eef2ff;
      color: #1d4ed8;
      font-size: 12px;
      border: 1px solid #dbeafe;
    }

    pre {
      margin: 0;
      overflow: auto;
      max-height: 230px;
      padding: 12px;
      border-radius: 10px;
      background: #111827;
      color: #e5e7eb;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: #475467;
      font-size: 12px;
    }

    .swatch {
      width: 18px;
      height: 5px;
      border-radius: 999px;
      background: var(--agent);
      flex: 0 0 auto;
    }

    .swatch.vln {
      background: var(--vln);
    }

    .swatch.robot {
      background: var(--robot);
    }

    .swatch.data {
      background: var(--data);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 1080px) {
      .app {
        grid-template-columns: 1fr;
      }

      .workspace,
      .details {
        min-height: auto;
      }

      .canvas {
        min-height: 820px;
        height: 820px;
      }
    }

    @media (max-width: 720px) {
      .app {
        padding: 12px;
      }

      .topbar {
        flex-direction: column;
      }

      .toolbar {
        justify-content: flex-start;
      }

      .node {
        width: 168px;
      }

      .legend {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="workspace">
      <div class="topbar">
        <div>
          <h1>从用户意图到机器人运动</h1>
          <div class="subtitle" id="subtitle">
            第一层展示完整链路：交互 Agent 理解用户意图，Motion Agent 组织任务，VLN 服务看图导航，ROS2 与机器人硬件执行动作。
          </div>
        </div>
        <div class="toolbar">
          <button id="overviewBtn" class="active" type="button">总览</button>
          <button id="motionBtn" type="button">Motion Agent</button>
        </div>
      </div>

      <div class="legend">
        <div class="legend-item"><span class="swatch"></span>Agent / 决策</div>
        <div class="legend-item"><span class="swatch vln"></span>VLN / 云端服务</div>
        <div class="legend-item"><span class="swatch data"></span>数据源</div>
        <div class="legend-item"><span class="swatch robot"></span>机器人执行</div>
      </div>

      <div class="canvas" id="canvas">
        <div class="viewport" id="viewport">
          <svg class="connections" id="connections" aria-hidden="true"></svg>
          <div id="nodes"></div>
          <div id="labels"></div>
        </div>
      </div>
    </section>

    <aside class="details" id="details">
      <div class="eyebrow">点击模块查看说明</div>
      <h2>系统总览</h2>
      <p>这张图的读法很简单：从左往右看数据流，从上往下看支撑能力。蓝色模块负责理解和调度，橙色模块负责视觉语言导航，紫色模块提供图像/地图数据，绿色模块负责真实运动。</p>
      <div class="section-title">你会看到什么</div>
      <p>点击 `Motion Agent` 可以进入内部骨架；点击其他模块可以看到概念解释、它做了什么，以及一条具体 JSON 或动作例子。</p>
    </aside>
  </main>

  <script>
    const views = {
      overview: {
        subtitle: "第一层展示完整链路：交互 Agent 理解用户意图，Motion Agent 组织任务，VLN 服务看图导航，ROS2 与机器人硬件执行动作。",
        nodes: [
          {
            id: "user",
            type: "agent",
            x: 6,
            y: 40,
            title: "用户意图",
            kicker: "Input",
            summary: "一句自然语言，比如“到张三那儿去”。",
            concept: "用户意图就是系统的起点。它通常不是机器能直接执行的命令，而是一句自然语言，需要被翻译成结构化任务。",
            does: "提供目标、对象、人名或停止要求。",
            example: "到张三那儿去"
          },
          {
            id: "interaction",
            type: "agent",
            x: 23,
            y: 22,
            title: "交互 Agent",
            kicker: "Conversation",
            summary: "接收用户话语，传给运动系统。",
            concept: "交互 Agent 像前台接待，负责听懂用户说了什么，并把任务交给运动系统 Agent。",
            does: "收集用户输入，必要时补充上下文，比如当前是在找人还是停止任务。",
            example: "用户说“跟着前面的人”，交互 Agent 把这句话交给 Motion Agent。"
          },
          {
            id: "motion",
            type: "agent",
            x: 23,
            y: 58,
            title: "Motion Agent",
            kicker: "Planner",
            summary: "把意图拆成 JSON，管理 VLN、停止和硬件任务。",
            concept: "Motion Agent 是运动系统的调度中心。它不一定亲自看图导航，但它决定该调用 VLN、停止服务，还是执行已有的 ROS2/电机任务。",
            does: "调用 LLM 做任务拆解；把 go_to_object、follow_person、stop 等任务发给 VLN；接收 VLN 的实时 command 和最终 result。",
            example: JSON.stringify({type: "go_to_object", user_prompt: "到张三那儿去", object_id: "张三"}, null, 2),
            drilldown: true
          },
          {
            id: "bridge",
            type: "vln",
            x: 43,
            y: 58,
            title: "Windows 桥接",
            kicker: "LAN Bridge",
            summary: "把板端请求转进云端 VLN 容器。",
            concept: "桥接程序是网络中转站。板端连 Windows 的局域网 IP，Windows 再通过 SSH 把 WebSocket 转到云端容器。",
            does: "监听 0.0.0.0:18000，转发到远端 127.0.0.1:18000。",
            example: "ws://192.168.31.9:18000/ws/navigate?token=DISABLE"
          },
          {
            id: "vln",
            type: "vln",
            x: 61,
            y: 58,
            title: "VLN Service",
            kicker: "Vision-Language Navigation",
            summary: "读取图像/地图，决策下一步怎么走。",
            concept: "VLN 是视觉语言导航服务。它综合用户目标、实时 RGB、深度和 ASM 地图，判断机器人下一步动作。",
            does: "接收 go_to_object、follow_person、stop；实时返回 command；最终返回 result。",
            example: JSON.stringify({command: "右转90度", inference_time_ms: "1739.72 ms", input_tokens: 5412, output_tokens: 6}, null, 2)
          },
          {
            id: "data",
            type: "data",
            x: 61,
            y: 22,
            title: "RGB / 深度 / ASM",
            kicker: "Sensors",
            summary: "VLN 做判断需要的实时环境数据。",
            concept: "这些是 VLN 的眼睛和地图。RGB 看画面，深度估距离，ASM 提供实时地图图像。",
            does: "RGB/深度从 ROS2 topic 读取；ASM 通过 /get_map_service 获取 map_image。",
            example: "GetMap.srv: int32 track_length -> sensor_msgs/Image map_image"
          },
          {
            id: "nav",
            type: "robot",
            x: 79,
            y: 39,
            title: "大导航 ROS2 Action",
            kicker: "NavigateToPose",
            summary: "把目标点发给导航栈。",
            concept: "大导航是机器人移动到某个定位点的执行系统。VLN 可以把目标 pose 发给 /navigate_to_pose。",
            does: "接收 PoseStamped 目标点，返回导航是否成功、当前位置、剩余距离等反馈。",
            example: "Goal: pose + behavior_tree；Result: result_number + result_msg"
          },
          {
            id: "robot",
            type: "robot",
            x: 79,
            y: 72,
            title: "机器人运动",
            kicker: "Actuation",
            summary: "底盘、头部、电机执行真实动作。",
            concept: "这是最终落地层。所有 JSON、模型判断和导航规划，最后都要变成机器人的真实运动。",
            does: "执行直行、转向、停止、头部回正、跟随等动作。",
            example: "收到“右转90度”后，底盘旋转到目标朝向。"
          }
        ],
        edges: [
          {from: "user", to: "interaction", label: "自然语言"},
          {from: "interaction", to: "motion", label: "任务意图"},
          {from: "motion", to: "bridge", label: "WebSocket JSON"},
          {from: "bridge", to: "vln", label: "SSH 转发"},
          {from: "data", to: "vln", label: "图像 / 地图"},
          {from: "vln", to: "nav", label: "目标点"},
          {from: "nav", to: "robot", label: "控制反馈"},
          {from: "vln", to: "motion", label: "command / result", reverse: true},
          {from: "motion", to: "robot", label: "停止 / 兜底控制"}
        ]
      },
      motion: {
        subtitle: "Motion Agent 内部骨架：自然语言先进入 LLM 规划，任务路由决定走 VLN、直接控制、停止，结果再回到上层。",
        nodes: [
          {
            id: "input",
            type: "agent",
            x: 6,
            y: 46,
            title: "输入入口",
            kicker: "Input Entry",
            summary: "接收字符串或 JSON 消息。",
            concept: "输入入口是 Motion Agent 收到任务的第一站。它可能收到一句自然语言，也可能收到已经带 type 和 params 的结构化 JSON。",
            does: "识别 type、params、user_prompt；如果已经是已知 type 就直接交给任务路由；如果没有 type 或 type 不认识，就交给 LLM 分析。",
            example: JSON.stringify({message: "到张三那儿去"}, null, 2)
          },
          {
            id: "llm",
            type: "agent",
            x: 23,
            y: 18,
            title: "LLM 任务拆解",
            kicker: "DeepSeek / OpenRouter",
            summary: "把自然语言变成严格 JSON。",
            concept: "LLM 不是直接控制机器人，而是把人的话翻译成可执行任务结构。",
            does: "读取 .env 中的 OpenRouter 配置，调用 deepseek/deepseek-chat-v3-0324。",
            example: JSON.stringify({type: "go_to_object", params: {user_prompt: "到张三那儿去", object_id: "张三"}}, null, 2)
          },
          {
            id: "parser",
            type: "agent",
            x: 23,
            y: 70,
            title: "JSON 容错解析",
            kicker: "Parser",
            summary: "从模型回复里抽取 JSON。",
            concept: "线上模型有时会把 JSON 包在 markdown 代码块里。容错解析负责把真正的 JSON 抠出来。",
            does: "先 json.loads；失败后解析 ```json 代码块；再尝试抽取 {...} 或 [...]。",
            example: "```json\\n{\"type\":\"default\",\"params\":{\"response\":\"pong\"}}\\n```"
          },
          {
            id: "router",
            type: "agent",
            x: 43,
            y: 45,
            title: "任务路由器",
            kicker: "Task Router",
            summary: "决定任务去哪里执行。",
            concept: "任务路由器像交通枢纽。它不是只分三类，而是根据 smart_robot_agent.py 里的 known_task_types 和 _execute_task_by_type，把不同 type 分到 VLN、查找感知、ROS2状态/外设、本地运动电机、停止中断等执行通道。",
            does: "导航类 go_to_object / go_find_person / follow_person 进入 VLN；find_object / find_person 做查找感知；状态和外设类走 ROS2 接口；电机和场景动作走本地运动控制；stop 和 emergency_stop 进入停止通道；未知 type 会回到 LLM 尝试重新归类，仍不支持则返回错误。",
            example: "type=go_find_person -> 记录当前位置 -> 组装 {type:'go_to_person'} -> 发送给 VLN"
          },
          {
            id: "vlnclient",
            type: "vln",
            x: 63,
            y: 9,
            title: "VLN 导航任务",
            kicker: "WebSocket Client",
            summary: "需要视觉语言导航推理的任务。",
            concept: "这类任务不是简单查状态，而是要让 VLN 根据图像、地图和目标语义判断下一步怎么走。",
            does: "go_to_object 发送找物导航；go_find_person 转成 go_to_person；follow_person 发送跟随请求；接收 VLN 的实时 command 和最终 result。",
            example: JSON.stringify({type: "go_to_person", user_prompt: "请去找张三", person_id: "张三"}, null, 2)
          },
          {
            id: "searchtasks",
            type: "data",
            x: 63,
            y: 31,
            title: "查找与感知任务",
            kicker: "Search / Perception",
            summary: "不一定让机器人移动，先查对象或人。",
            concept: "这类任务更像“先看/先查”，用于查找物品、人脸或历史记录。它可能读 ASM JSON、history.db、相机 RGB 或人脸识别服务。",
            does: "find_object 先查 ASM，再查 history.db；find_person 调用相机图像和人脸识别服务；delete_person 调用 ROS2 删除人员信息。",
            example: JSON.stringify({type: "find_person", params: {obj_name: "张三", user_prompt: "看看张三在不在"}}, null, 2)
          },
          {
            id: "rosiotasks",
            type: "data",
            x: 63,
            y: 53,
            title: "ROS2 状态/外设任务",
            kicker: "State / IO",
            summary: "查询或设置机器人状态与外设。",
            concept: "这类任务通常不需要 VLN 推理，直接通过 ROS2 service/topic 查询状态或设置外设。",
            does: "包含 get_move_mode、药箱开关、升降/倾斜/屏幕、激光笔、RGB 灯等 get/set 任务。",
            example: JSON.stringify({type: "set_rgb", params: {color: "blue", mode: "steady"}}, null, 2)
          },
          {
            id: "motiontasks",
            type: "robot",
            x: 63,
            y: 75,
            title: "本地运动/电机任务",
            kicker: "Motors / Scenes",
            summary: "直接控制底盘、头部、电机或场景动作。",
            concept: "这类任务已经是机器人本地可执行动作，不需要再让 VLN 看图规划。",
            does: "包含 back_to_last_position、go_to_door、head_reset_to_zero、set_head_motor_control、set_combine_motor_control、four_dof_head_sequence、patrol_table_inspection、obstacle_avoidance_turn 等。",
            example: JSON.stringify({type: "head_reset_to_zero", params: {}}, null, 2)
          },
          {
            id: "stop",
            type: "stop",
            x: 82,
            y: 17,
            title: "停止与中断",
            kicker: "Stop",
            summary: "停止 VLN 或本地运动。",
            concept: "停止不是普通动作，它要尽量快、尽量可靠。用户说停下时，Motion Agent 应同时考虑 VLN 任务和本地运动状态。",
            does: "stop_follow / stop_navigate / stop_move 分别处理跟随、导航和本地移动停止；emergency_stop 会发布零速度并清空活跃导航任务。",
            example: JSON.stringify({type: "emergency_stop", params: {}}, null, 2)
          },
          {
            id: "unknown",
            type: "stop",
            x: 82,
            y: 46,
            title: "未知/自然语言兜底",
            kicker: "Fallback",
            summary: "不认识的 type 或无 type 输入会回到 LLM。",
            concept: "如果输入不是已知任务，Agent 不会盲目执行。它会让 LLM 尝试把自然语言或未知 type 归类成 known_task_types 里的一个任务。",
            does: "LLM 如果返回 default，就作为普通问答回复；如果返回已知任务，就继续执行；如果返回仍不支持的 type，就返回不支持/未知任务错误。",
            example: JSON.stringify({type: "dance", params: {style: "random"}}, null, 2)
          },
          {
            id: "result",
            type: "agent",
            x: 82,
            y: 74,
            title: "结果回传",
            kicker: "Response",
            summary: "把实时 command 和最终结果返回上层。",
            concept: "结果回传让交互系统知道机器人正在做什么，以及任务最后是否成功。",
            does: "实时展示 command，最终返回 result=true/false 和 error_msg。",
            example: JSON.stringify({result: true, error_msg: ""}, null, 2)
          }
        ],
        edges: [
          {from: "input", to: "llm", label: "自然语言", labelDx: -10, labelDy: -10},
          {from: "llm", to: "parser", label: "模型回复", labelDx: -22, labelDy: -24},
          {from: "parser", to: "router", label: "结构化任务", labelDx: -18, labelDy: 6},
          {from: "input", to: "router", label: "已有 JSON", labelDx: -22, labelDy: 16},
          {from: "router", to: "vlnclient", label: "导航类", labelDx: -16, labelDy: -18},
          {from: "router", to: "searchtasks", label: "查找/感知", labelDx: -6, labelDy: 55},
          {from: "router", to: "rosiotasks", label: "状态/外设", labelDx: -4, labelDy: -54},
          {from: "router", to: "motiontasks", label: "运动/电机", labelDx: 166, labelDy: 34},
          {from: "router", to: "stop", label: "停止/急停", labelDx: 26, labelDy: -20},
          {from: "router", to: "unknown", label: "未知 type", labelDx: 22, labelDy: -32},
          {from: "unknown", to: "llm", label: "重新归类", reverse: true, labelDx: -76, labelDy: -56},
          {from: "vlnclient", to: "result", label: "command / result", labelDx: 30, labelDy: -82},
          {from: "searchtasks", to: "result", label: "查找结果", labelDx: 215, labelDy: -34},
          {from: "rosiotasks", to: "result", label: "状态/设置结果", labelDx: 235, labelDy: 136},
          {from: "motiontasks", to: "result", label: "执行结果", labelDx: -20, labelDy: 28},
          {from: "stop", to: "result", label: "停止结果", labelDx: 315, labelDy: -8},
          {from: "unknown", to: "result", label: "default / error", labelDx: 54, labelDy: 4}
        ]
      }
    };

    let currentView = "overview";
    let selectedId = "motion";

    const canvas = document.getElementById("canvas");
    const viewport = document.getElementById("viewport");
    const nodeLayer = document.getElementById("nodes");
    const labelLayer = document.getElementById("labels");
    const connections = document.getElementById("connections");
    const details = document.getElementById("details");
    const subtitle = document.getElementById("subtitle");
    const overviewBtn = document.getElementById("overviewBtn");
    const motionBtn = document.getElementById("motionBtn");
    const panState = {
      x: 0,
      y: 0,
      active: false,
      startX: 0,
      startY: 0,
      originX: 0,
      originY: 0,
      scale: 0.92
    };
    let suppressClick = false;

    function nodeHtml(node) {
      const hint = node.drilldown ? '<div class="open-hint">点击进入内部骨架</div>' : "";
      return `
        <button class="node ${node.type}" id="node-${node.id}" type="button" style="left:${node.x}%;top:${node.y}%">
          <div class="kicker">${node.kicker}</div>
          <h2>${node.title}</h2>
          <p>${node.summary}</p>
          ${hint}
        </button>
      `;
    }

    function render(viewName, focusId) {
      currentView = viewName;
      const view = views[viewName];
      selectedId = focusId || view.nodes[0].id;
      subtitle.textContent = view.subtitle;
      overviewBtn.classList.toggle("active", viewName === "overview");
      motionBtn.classList.toggle("active", viewName === "motion");
      nodeLayer.innerHTML = view.nodes.map(nodeHtml).join("");
      labelLayer.innerHTML = "";
      setTransform(viewName === "motion" ? 4 : 24, viewName === "motion" ? 12 : 16, viewName === "motion" ? 0.78 : 0.92);
      view.nodes.forEach((node) => {
        const el = document.getElementById(`node-${node.id}`);
        setupNodeInteractions(el, node);
      });
      requestAnimationFrame(() => {
        drawConnections();
        selectNode(selectedId);
      });
    }

    function setupNodeInteractions(el, node) {
      const drag = {
        active: false,
        moved: false,
        offsetX: 0,
        offsetY: 0,
        startX: 0,
        startY: 0
      };

      el.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
        drag.active = true;
        drag.moved = false;
        drag.startX = event.clientX;
        drag.startY = event.clientY;
        const rect = el.getBoundingClientRect();
        drag.offsetX = event.clientX - rect.left;
        drag.offsetY = event.clientY - rect.top;
        el.setPointerCapture(event.pointerId);
        el.classList.add("dragging");
      });

      el.addEventListener("pointermove", (event) => {
        if (!drag.active) return;
        const distance = Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY);
        if (distance > 4) {
          drag.moved = true;
        }
        if (!drag.moved) return;

        const viewportRect = viewport.getBoundingClientRect();
        const maxX = viewport.offsetWidth - el.offsetWidth;
        const maxY = viewport.offsetHeight - el.offsetHeight;
        const nextLeft = clamp((event.clientX - viewportRect.left) / panState.scale - drag.offsetX / panState.scale, 8, maxX - 8);
        const nextTop = clamp((event.clientY - viewportRect.top) / panState.scale - drag.offsetY / panState.scale, 8, maxY - 8);

        node.x = (nextLeft / viewport.offsetWidth) * 100;
        node.y = (nextTop / viewport.offsetHeight) * 100;
        el.style.left = `${node.x}%`;
        el.style.top = `${node.y}%`;
        drawConnections();
      });

      el.addEventListener("pointerup", (event) => {
        if (!drag.active) return;
        drag.active = false;
        el.releasePointerCapture(event.pointerId);
        el.classList.remove("dragging");

        if (drag.moved) {
          suppressClick = true;
          window.setTimeout(() => {
            suppressClick = false;
          }, 0);
          selectNode(node.id);
          return;
        }

        if (node.drilldown) {
          render("motion", "input");
        } else {
          selectNode(node.id);
        }
      });

      el.addEventListener("pointercancel", () => {
        drag.active = false;
        el.classList.remove("dragging");
      });
    }

    function setTransform(x, y, scale = panState.scale) {
      panState.x = x;
      panState.y = y;
      panState.scale = clamp(scale, 0.55, 1.65);
      viewport.style.transform = `translate(${panState.x}px, ${panState.y}px) scale(${panState.scale})`;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function selectNode(id) {
      selectedId = id;
      document.querySelectorAll(".node").forEach((el) => el.classList.remove("selected"));
      const el = document.getElementById(`node-${id}`);
      if (el) el.classList.add("selected");
      const node = views[currentView].nodes.find((item) => item.id === id);
      if (!node) return;

      const example = typeof node.example === "string" && node.example.trim().startsWith("{")
        ? node.example
        : String(node.example);
      const code = example.includes("\n") || example.includes("{")
        ? `<pre>${escapeHtml(example)}</pre>`
        : `<p>${escapeHtml(example)}</p>`;

      details.innerHTML = `
        <div class="eyebrow">${node.kicker}</div>
        <h2>${node.title}</h2>
        <p>${node.concept}</p>
        <div class="section-title">它做了什么</div>
        <p>${node.does}</p>
        <div class="section-title">对应例子</div>
        ${code}
        <div class="section-title">相关关键词</div>
        <div class="pill-row">
          ${keywordsFor(node).map((keyword) => `<span class="pill">${keyword}</span>`).join("")}
        </div>
      `;
    }

    function keywordsFor(node) {
      const map = {
        user: ["自然语言", "目标", "意图"],
        interaction: ["对话入口", "上下文", "任务转交"],
        motion: ["任务拆解", "路由", "VLN 协议"],
        bridge: ["18000", "SSH", "局域网"],
        vln: ["视觉导航", "command", "result"],
        data: ["RGB", "Depth", "ASM"],
        nav: ["NavigateToPose", "PoseStamped", "Feedback"],
        robot: ["底盘", "头部", "执行"],
        input: ["WebSocket", "JSON", "user_prompt"],
        llm: ["OpenRouter", "DeepSeek", "JSON"],
        parser: ["json.loads", "代码块", "容错"],
        router: ["type", "params", "执行通道"],
        vlnclient: ["go_to_object", "go_find_person", "follow_person"],
        searchtasks: ["find_object", "find_person", "delete_person"],
        rosiotasks: ["get/set", "ROS2", "外设状态"],
        motiontasks: ["电机", "场景动作", "底盘"],
        stop: ["中断", "停止", "安全"],
        unknown: ["LLM兜底", "default", "不支持错误"],
        result: ["实时反馈", "最终结果", "error_msg"]
      };
      return map[node.id] || ["模块", "职责", "示例"];
    }

    function drawConnections() {
      const view = views[currentView];
      const rect = viewport.getBoundingClientRect();
      connections.setAttribute("viewBox", `0 0 ${rect.width} ${rect.height}`);
      connections.innerHTML = `
        <defs>
          <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="2.5" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,5 L7,2.5 z" fill="${getComputedStyle(document.documentElement).getPropertyValue("--line").trim()}" />
          </marker>
        </defs>
      `;
      labelLayer.innerHTML = "";

      view.edges.forEach((edge, index) => {
        const from = getAnchor(edge.from, edge.reverse ? "left" : "right");
        const to = getAnchor(edge.to, edge.reverse ? "right" : "left");
        if (!from || !to) return;
        const offset = (index % 3 - 1) * 18;
        const midX = (from.x + to.x) / 2 + offset;
        const path = `M ${from.x} ${from.y} C ${midX} ${from.y}, ${midX} ${to.y}, ${to.x} ${to.y}`;
        const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
        line.setAttribute("d", path);
        line.setAttribute("fill", "none");
        line.setAttribute("stroke", "var(--line)");
        line.setAttribute("stroke-width", "1.55");
        line.setAttribute("stroke-linecap", "round");
        line.setAttribute("marker-end", "url(#arrow)");
        line.setAttribute("opacity", "0.68");
        connections.appendChild(line);

        const label = document.createElement("div");
        label.className = "flow-label";
        label.textContent = edge.label;
        label.style.left = `${(from.x + to.x) / 2 + (edge.labelDx || 0)}px`;
        label.style.top = `${(from.y + to.y) / 2 - 18 + offset / 3 + (edge.labelDy || 0)}px`;
        labelLayer.appendChild(label);
      });
    }

    function getAnchor(id, side) {
      const el = document.getElementById(`node-${id}`);
      if (!el) return null;
      const canvasRect = viewport.getBoundingClientRect();
      const rect = el.getBoundingClientRect();
      const x = side === "left" ? rect.left - canvasRect.left : rect.right - canvasRect.left;
      const y = rect.top - canvasRect.top + rect.height / 2;
      return {x, y};
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    overviewBtn.addEventListener("click", () => render("overview", "motion"));
    motionBtn.addEventListener("click", () => render("motion", "input"));
    canvas.addEventListener("pointerdown", (event) => {
      if (event.target.closest(".node")) return;
      panState.active = true;
      panState.startX = event.clientX;
      panState.startY = event.clientY;
      panState.originX = panState.x;
      panState.originY = panState.y;
      canvas.setPointerCapture(event.pointerId);
      canvas.classList.add("panning");
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!panState.active) return;
      setTransform(
        panState.originX + event.clientX - panState.startX,
        panState.originY + event.clientY - panState.startY,
        panState.scale
      );
    });

    canvas.addEventListener("pointerup", (event) => {
      if (!panState.active) return;
      panState.active = false;
      canvas.releasePointerCapture(event.pointerId);
      canvas.classList.remove("panning");
    });

    canvas.addEventListener("pointercancel", () => {
      panState.active = false;
      canvas.classList.remove("panning");
    });

    canvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      const canvasRect = canvas.getBoundingClientRect();
      const pointerX = event.clientX - canvasRect.left;
      const pointerY = event.clientY - canvasRect.top;
      const beforeX = (pointerX - panState.x) / panState.scale;
      const beforeY = (pointerY - panState.y) / panState.scale;
      const factor = Math.exp(-event.deltaY * 0.0012);
      const nextScale = clamp(panState.scale * factor, 0.55, 1.65);
      const nextX = pointerX - beforeX * nextScale;
      const nextY = pointerY - beforeY * nextScale;
      setTransform(nextX, nextY, nextScale);
    }, {passive: false});

    window.addEventListener("resize", drawConnections);

    render("overview", "motion");
  </script>
</body>
</html>
